<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restablecer contraseña | PLUTÓN ACADEMIC</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#07142c,#102f58);color:#fff;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,460px);background:#0b1c38;border:1px solid #b89a55;border-radius:18px;padding:30px;box-shadow:0 16px 45px #0006}
h1{font-size:1.5rem;margin:8px 0 16px}.brand{color:#e7c775;font-weight:800;letter-spacing:.05em}
label{display:block;margin:16px 0 6px}input{width:100%;padding:13px;border-radius:8px;border:1px solid #8a9db8;background:#fff;color:#111;font-size:1rem}
.password-row{display:flex;gap:8px}.password-row input{flex:1;min-width:0}.eye{width:48px;border:1px solid #8a9db8;background:#203b60;color:#fff;border-radius:8px;cursor:pointer;font-size:1.15rem}
.submit{margin-top:20px;width:100%;background:#d4af57;color:#09172c;border:0;border-radius:8px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}
a{color:#e7c775}#message{min-height:25px;line-height:1.5}small{color:#d0d7e5}
</style></head><body><main><div class="brand">◉ PLUTÓN ACADEMIC</div><h1>Crear una nueva contraseña</h1>
<p id="intro">Por seguridad, escribe y confirma tu nueva contraseña.</p>
<form id="resetForm" hidden>
<label for="password">Nueva contraseña</label><div class="password-row"><input id="password" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="eye" data-for="password" aria-label="Mostrar contraseña" aria-pressed="false">◉</button></div>
<label for="confirm">Confirmar contraseña</label><div class="password-row"><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="eye" data-for="confirm" aria-label="Mostrar contraseña" aria-pressed="false">◉</button></div>
<small>Utiliza al menos 8 caracteres.</small>
<button id="save" class="submit" type="submit">Guardar nueva contraseña</button></form>
<p id="message" role="status" aria-live="polite">Verificando el enlace de recuperación…</p><a href="/">Volver a PLUTÓN ACADEMIC</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const url='https://paifjzznyiehwidoqjqb.supabase.co';
const key='sb_publishable_-Ip2JRpDGn-Ehx2C94Tk3Q_jg7p7VLz';
const form=document.getElementById('resetForm'),message=document.getElementById('message'),save=document.getElementById('save');
const client=window.supabase?.createClient(url,key,{auth:{detectSessionInUrl:true,persistSession:false,autoRefreshToken:false}});
if(!client){message.textContent='No se pudo conectar con el servicio. Recarga esta página.';return;}
let authorized=false,done=false;
function ready(){if(done)return;authorized=true;form.hidden=false;message.textContent='Enlace verificado. Puedes crear tu contraseña.';}
function fail(){if(done)return;authorized=false;form.hidden=true;message.textContent='El enlace no es válido o ha caducado. Solicita uno nuevo desde Iniciar sesión.';}
client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY' && session)ready();});
(async()=>{
try{
const params=new URLSearchParams(location.search);
const hash=new URLSearchParams(location.hash.slice(1));
if(params.get('error')||hash.get('error')){fail();return;}
if(params.get('token_hash')&&params.get('type')==='recovery'){
const {error}=await client.auth.verifyOtp({token_hash:params.get('token_hash'),type:'recovery'});if(error){fail();return;}ready();return;
}
if(params.get('code')){
const {error}=await client.auth.exchangeCodeForSession(params.get('code'));if(error){fail();return;}ready();return;
}
if(hash.get('access_token')&&hash.get('type')==='recovery'){
const {error}=await client.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')||''});if(error){fail();return;}ready();return;
}
fail();
}catch(e){fail();}
})();
document.querySelectorAll('.eye').forEach(button=>button.addEventListener('click',()=>{
const input=document.getElementById(button.dataset.for),visible=input.type==='password';
input.type=visible?'text':'password';button.setAttribute('aria-pressed',String(visible));
button.setAttribute('aria-label',visible?'Ocultar contraseña':'Mostrar contraseña');
button.textContent=visible?'⊘':'◉';
}));
form.addEventListener('submit',async e=>{
e.preventDefault();if(!authorized||done)return;
const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
if(password.length<8){message.textContent='La contraseña debe tener al menos 8 caracteres.';return;}
if(password!==confirm){message.textContent='Las contraseñas no coinciden.';return;}
save.disabled=true;message.textContent='Guardando contraseña…';
try{const {error}=await client.auth.updateUser({password});if(error)throw error;
done=true;form.hidden=true;message.textContent='Contraseña actualizada correctamente. Ya puedes iniciar sesión.';
await client.auth.signOut({scope:'local'});
}catch(e){message.textContent='No se pudo actualizar la contraseña. Comprueba el enlace o solicita uno nuevo.';save.disabled=false;}
});
})();
</script></body></html>
