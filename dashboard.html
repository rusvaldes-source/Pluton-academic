<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del Estudiante | PLUTÓN ACADEMIC</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="student-dashboard">
    <header>
      <h1>PLUTÓN ACADEMIC</h1>
      <p>Panel del Estudiante</p>
    </header>

    <section>
      <h2>Bienvenido</h2>
      <p id="student-email">Cargando tu cuenta...</p>
    </section>

    <section>
      <h2>Mi membresía</h2>
      <p>Estado: <strong>Activa</strong></p>
    </section>

    <section>
      <h2>Mis cursos</h2>
      <p>Aquí aparecerán tus cursos y tu progreso académico.</p>
    </section>

    <section>
      <h2>Mi progreso</h2>
      <p>Progreso general: 0%</p>
    </section>

    <button id="logoutButton" type="button">Cerrar sesión</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
