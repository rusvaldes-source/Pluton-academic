<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del Estudiante | PLUTÓN ACADEMIC</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="student-dashboard">
    <header>
      <h1>PLUTÓN ACADEMIC</h1>
      <p>Panel del Estudiante</p><button id="languageToggle" class="language-toggle" type="button" onclick="changeDashboardLanguage()">EN</button>
    </header>

    <section>
      <h2>Bienvenido</h2>
      <p id="student-email">Cargando tu cuenta...</p>
    </section>

    <section>
      <h2>Mi membresía</h2>
      <strong id="membership">Cargando...</strong>
    </section>

    <section>
      <h2>Mis cursos</h2>
      <p data-i18n="courseHint">Explora las lecciones disponibles y registra tu avance.</p><a class="pa-link" href="courses.html" data-i18n="goCourses">Abrir mis cursos →</a>
    </section>

    <section>
      <h2>Mi progreso</h2>
      <p id="overallProgress" data-i18n="overall">Progreso general: 0%</p>
    </section>

    <button id="logoutButton" type="button">Cerrar sesión</button>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="language.js?v=20261007-final2"></script>
<script src="dashboard.js?v=20261007-final2"></script>
</body>
</html>
