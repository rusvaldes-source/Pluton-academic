<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLUTÓN ACADEMIC · Cursos B114</title><link rel="stylesheet" href="classroom.css"><style>.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:1rem}.course{background:#fff;padding:1rem;border-radius:12px;box-shadow:0 3px 16px #0001}.course img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px}.course a{color:#173a69}</style></head><body><header><a href="../index.html">← PLUTÓN ACADEMIC</a><button id="language" type="button">English</button></header><main><h1 id="heading">Cursos en preparación</h1><p id="notice">Estos cursos aún no están publicados ni disponibles para compra.</p><div class="cards" id="courses"></div></main><script>
(()=>{'use strict';const data=[['FA-101','Primeros Auxilios y Emergencias','First Aid and Emergencies',10],['DRV-101','Formación para Conductores de Camiones CDL con inglés profesional','CDL Truck Driver Training with Professional English',12],['MED-201','Facturación y Codificación Médica en Estados Unidos','Medical Billing and Coding in the United States',12]];let en=false;function render(){document.documentElement.lang=en?'en':'es';document.getElementById('language').textContent=en?'Español':'English';document.getElementById('heading').textContent=en?'Courses in preparation':'Cursos en preparación';document.getElementById('notice').textContent=en?'These courses are not published or available for purchase yet.':'Estos cursos aún no están publicados ni disponibles para compra.';const target=document.getElementById('courses');target.replaceChildren();for(const [code,es,english,count] of data){const article=document.createElement('article');article.className='course';const img=document.createElement('img');img.src='covers/'+code+'.webp';img.alt=en?english:es;img.loading='lazy';const title=document.createElement('h2');title.textContent=en?english:es;const info=document.createElement('p');info.textContent=count+(en?' lessons · Pending review':' lecciones · Pendiente de revisión');article.append(img,title,info);target.append(article)}}document.getElementById('language').onclick=()=>{en=!en;render()};render()})();
</script></body></html>
