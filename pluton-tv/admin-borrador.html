<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PLUTÓN TV · Editor de prueba</title>
<style>body{background:#07152c;color:#f6f3e9;font:16px system-ui;margin:auto;max-width:800px;padding:24px}h1{color:#e7c477}label{display:block;margin:16px 0 6px;font-weight:700}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;background:#132b4b;color:white;border:1px solid #73839a;border-radius:8px}button{background:#e7c477;color:#07152c;border:0;border-radius:8px;padding:12px 16px;margin:12px 8px 8px 0;font-weight:700;cursor:pointer}video{width:100%;background:#000;max-height:380px}small,p{line-height:1.5;color:#cbd6e5}.notice{border:1px solid #e7c477;padding:12px;border-radius:8px}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><h1>PLUTÓN TV · Preparar un programa</h1><p class="notice">Editor de demostración en la rama de pruebas. <strong>No es un panel privado autenticado y no publica contenido.</strong> La conexión al panel administrativo y el almacenamiento seguro están pendientes.</p>
<form id="f"><label for="title">Título del programa</label><input id="title" required maxlength="100" placeholder="Ej. Conversaciones en familia">
<label for="section">Sección</label><select id="section"><option>PLUTÓN FAMILIA</option><option>PLUTÓN EDUCA</option><option>PLUTÓN DESCUBRE</option><option>PLUTÓN EMPRENDE</option><option>PLUTÓN TV ORIGINAL</option></select>
<label for="url">Pega el enlace directo del video (MP4 o WebM)</label><input id="url" type="url" required placeholder="https://.../mi-video.mp4">
<label for="description">Descripción</label><textarea id="description" rows="3" maxlength="500"></textarea>
<label for="rights"><input id="rights" type="checkbox" required style="width:auto"> Confirmo que soy titular de los derechos o tengo autorización para publicar este video.</label>
<button type="submit">Vista previa</button><button type="button" id="copy">Copiar ficha para integración</button></form>
<section><h2>Vista previa local</h2><video id="preview" controls playsinline preload="metadata"></video><p id="status" role="status">Completa el formulario para probar el video.</p><output id="json"></output></section>
<script>(()=>{'use strict';const $=id=>document.getElementById(id);let record=null;function read(){const url=new URL($('url').value);if(url.protocol!=='https:'||url.username||url.password)throw Error('Usa un enlace HTTPS válido.');if(!/\.(mp4|webm)(?:$|[?#])/i.test(url.pathname))throw Error('Este editor acepta enlaces directos .mp4 o .webm, no enlaces a páginas.');if(!$('rights').checked)throw Error('Confirma los derechos de publicación.');return {id:'original-'+Date.now(),type:'video',section:$('section').value,title:$('title').value.trim(),description:$('description').value.trim(),src:url.href,approved_for_tv:false,publication_status:'draft_pending_review',rights_confirmed_by_submitter:true}}$('f').onsubmit=e=>{e.preventDefault();try{record=read();$('preview').src=record.src;$('preview').load();$('status').textContent='Vista previa preparada. Pulsa ▶ para comprobar reproducción. No se ha publicado.';$('json').textContent=JSON.stringify(record,null,2)}catch(err){$('status').textContent=err.message}};$('preview').onerror=()=>{$('status').textContent='El video no se puede reproducir desde este enlace. Revisa formato, permisos y alojamiento.'};$('copy').onclick=async()=>{if(!record){$('status').textContent='Primero prepara la vista previa.';return}try{await navigator.clipboard.writeText(JSON.stringify(record,null,2));$('status').textContent='Ficha copiada. Aún no se ha publicado.'}catch{$('status').textContent='No se pudo copiar automáticamente. Selecciona el texto de la ficha.'}}})();</script></body></html>
